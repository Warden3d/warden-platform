<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 540"
     fill="none"
     color="#48B8F5"
     role="presentation"
     aria-hidden="true"
     preserveAspectRatio="none">
  <defs>
    <linearGradient id="warden-v2-edge" x1="12" y1="8" x2="346" y2="532"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#253A46"/>
      <stop offset=".28" stop-color="#49606C"/>
      <stop offset=".58" stop-color="#1B2D36"/>
      <stop offset=".84" stop-color="#3A505C"/>
      <stop offset="1" stop-color="#1A2B34"/>
    </linearGradient>
    <linearGradient id="warden-v2-accent" x1="88" y1="0" x2="277" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="currentColor" stop-opacity=".08"/>
      <stop offset=".5" stop-color="currentColor" stop-opacity=".72"/>
      <stop offset="1" stop-color="currentColor" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <g vector-effect="non-scaling-stroke" stroke-linejoin="miter">
    <!-- Contorno exterior completo -->
    <path d="M25 6H111L125 18H331L351 38V100L356 106V467L350 473V510L334 527H126L112 534H26L8 516V449L3 443V97L8 91V30Z"
          stroke="url(#warden-v2-edge)"
          stroke-width="2.2"/>

    <!-- Refuerzo de biseles: solo esquinas, sin ornamentación lateral -->
    <g stroke="#405965" stroke-width="1" opacity=".7">
      <path d="M25 13H108L121 24"/>
      <path d="M330 24 343 41V96"/>
      <path d="M343 478V505L329 519H128"/>
      <path d="M108 526H31L16 511V458"/>
    </g>

    <!-- Línea interior parcial y discreta; la franja inferior queda abierta -->
    <path d="M24 426V108L29 102V42L35 35H103L117 46H319L330 52V111L336 117V426"
          stroke="#29414C"
          stroke-width=".85"
          opacity=".72"/>

    <!-- Detalles técnicos superiores -->
    <path d="M42 9H106L120 21H231L243 14H317"
          stroke="#38515D"
          stroke-width="3"
          opacity=".65"/>
    <path d="M88 20H120L127 25H225L234 20H274"
          stroke="url(#warden-v2-accent)"
          stroke-width="1"/>
    <g fill="currentColor" opacity=".55" stroke="none">
      <circle cx="39" cy="16" r="1.15"/>
      <circle cx="321" cy="26" r="1.05"/>
    </g>

    <!-- Único detalle inferior, adherido al perímetro exterior -->
    <path d="M65 526H108L123 518H236L249 524H307"
          stroke="#344C58"
          stroke-width="1"
          opacity=".72"/>
    <path d="M129 522H229"
          stroke="url(#warden-v2-accent)"
          stroke-width=".9"/>
  </g>
</svg>
