<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 540"
     fill="none"
     color="#48B8F5"
     role="presentation"
     aria-hidden="true"
     preserveAspectRatio="none">
  <defs>
    <linearGradient id="warden-v2-edge" x1="12" y1="8" x2="346" y2="532"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#253A46"/>
      <stop offset=".28" stop-color="#49606C"/>
      <stop offset=".58" stop-color="#1B2D36"/>
      <stop offset=".84" stop-color="#3A505C"/>
      <stop offset="1" stop-color="#1A2B34"/>
    </linearGradient>
    <linearGradient id="warden-v2-accent" x1="88" y1="0" x2="277" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="currentColor" stop-opacity=".08"/>
      <stop offset=".5" stop-color="currentColor" stop-opacity=".72"/>
      <stop offset="1" stop-color="currentColor" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <g vector-effect="non-scaling-stroke" stroke-linejoin="miter">
    <!-- Contorno exterior único: laterales rectos y cortes a 45 grados -->
    <path d="M24 6H111L125 18H332L352 38V506L333 527H126L112 534H25L8 517V31Z"
          stroke="url(#warden-v2-edge)"
          stroke-width="2.2"/>

    <!-- Pestaña técnica superior -->
    <path d="M43 8H106L120 20H230L242 14H316"
          stroke="#38515D"
          stroke-width="3"
          opacity=".65"/>
    <path d="M92 20H119L126 24H226L234 20H270"
          stroke="url(#warden-v2-accent)"
          stroke-width="1"/>

    <!-- Dos detalles técnicos aislados -->
    <g fill="currentColor" opacity=".58" stroke="none">
      <circle cx="39" cy="16" r="1.15"/>
      <circle cx="321" cy="26" r="1.05"/>
    </g>

    <!-- Acento inferior único, pegado al perímetro -->
    <path d="M126 526H235"
          stroke="url(#warden-v2-accent)"
          stroke-width=".9"/>
  </g>
</svg>
